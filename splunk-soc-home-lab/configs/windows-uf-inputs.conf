# Windows Universal Forwarder inputs for the home lab.
# Configure only on a disposable/owned Windows lab endpoint.
# current_only=1 starts collection from new events after deployment.

[WinEventLog://Security]
disabled = 0
index = wineventlog
renderXml = 1
current_only = 1

[WinEventLog://System]
disabled = 0
index = wineventlog
renderXml = 1
current_only = 1

[WinEventLog://Application]
disabled = 0
index = wineventlog
renderXml = 1
current_only = 1
